<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schüler-Challenges</title>
  <meta name="description" content="Jeden Monat eine neue Herausforderung. Kostenlos, freiwillig, allein oder im Team." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="eye">👁</span>
      <span class="brand-name">SCHÜLER-CHALLENGES</span>
    </a>
    <nav>
      <a href="gallery.html">Galerie</a>
      <a href="feedback.html">Nachricht</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>SCHÜLER-CHALLENGES</h1>
      <p class="tagline">Jeden Monat eine neue Herausforderung.</p>
      <p class="watch-line">The Challenge Master is watching. 👁</p>
    </section>

    <section id="current-challenge">
      <p class="form-note">Lade aktuelle Challenge …</p>
    </section>
  </main>

  <footer class="site-footer">
    <span>© Challenge Master</span>
    <a href="feedback.html">Nachricht an den Challenge Master</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    async function loadActiveChallenge() {
      const container = document.getElementById("current-challenge");
      const { data, error } = await supabase
        .from("challenges")
        .select("*")
        .eq("is_active", true)
        .limit(1)
        .maybeSingle();

      console.log("Supabase-Antwort:", { data, error });
      if (error || !data) {
        container.innerHTML = `<p class="form-note">Gerade läuft keine Challenge. Schau bald wieder vorbei.</p>`;
        return;
      }

      const deadline = new Date(data.deadline).toLocaleDateString("de-DE", {
        day: "2-digit", month: "long", year: "numeric"
      });

      container.innerHTML = `
        <article class="case-file">
          <span class="stamp">Aktueller Fall</span>
          <div class="emoji-tag">${escapeHtml(data.emoji || "🎯")}</div>
          <h2>${escapeHtml(data.title)}</h2>
          <p>${escapeHtml(data.description)}</p>
          <p class="meta">Abgabe bis: ${deadline}</p>
          <p style="margin-top:1.1rem;">
            <a class="btn btn-primary" href="challenge.html">CHALLENGE ANSEHEN</a>
          </p>
        </article>
      `;
    }

    loadActiveChallenge();
    trackPageView("home");
  </script>
</body>
</html>
