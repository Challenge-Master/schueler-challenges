<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Challenge – Schüler-Challenges</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="eye">👁</span>
      <span class="brand-name">SCHÜLER-CHALLENGES</span>
    </a>
    <nav>
      <a href="gallery.html">Galerie</a>
      <a href="feedback.html">Nachricht</a>
    </nav>
  </header>

  <main class="wrap">
    <section id="challenge-detail">
      <p class="form-note">Lade Challenge …</p>
    </section>

    <section id="submit-section" style="display:none;">
      <h2 style="font-family: var(--font-display); font-size:1.2rem;">TEILNEHMEN</h2>
      <form id="submit-form">
        <label for="display_name">Teilnehmer- oder Teamname (kein Klarname nötig)</label>
        <input type="text" id="display_name" required maxlength="40" placeholder="z. B. Die Gruftgeister" />

        <label>
          <input type="checkbox" id="is_team" style="width:auto; display:inline-block; margin-right:0.4rem;" />
          Das ist eine Team-Abgabe
        </label>

        <label for="description">Kurze Beschreibung (optional)</label>
        <textarea id="description" maxlength="300" placeholder="Was ist auf deiner Abgabe zu sehen?"></textarea>

        <label for="media">Foto oder Video (max. 20 MB)</label>
        <input type="file" id="media" accept="image/*,video/*" required />
        <p class="form-note">
          Bitte nur hochladen, wenn keine dritte Person ohne ihre Zustimmung erkennbar ist.
          Dein Beitrag wird vor der Veröffentlichung geprüft und erscheint nicht sofort in der Galerie.
        </p>

        <p style="margin-top:1.2rem;">
          <button class="btn btn-primary" type="submit">ABGABE SENDEN</button>
        </p>
        <p id="submit-status" class="form-status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <span>© Challenge Master</span>
    <a href="feedback.html">Nachricht an den Challenge Master</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    let activeChallenge = null;

    async function loadChallenge() {
      const detail = document.getElementById("challenge-detail");
      const { data, error } = await supabase
        .from("challenges")
        .select("*")
        .eq("is_active", true)
        .limit(1)
        .maybeSingle();

      if (error || !data) {
        detail.innerHTML = `<p class="form-note">Gerade läuft keine Challenge.</p>`;
        return;
      }

      activeChallenge = data;
      const deadline = new Date(data.deadline).toLocaleString("de-DE", {
        day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit"
      });

      detail.innerHTML = `
        <article class="case-file">
          <span class="stamp">Aktueller Fall</span>
          <div class="emoji-tag">${escapeHtml(data.emoji || "🎯")}</div>
          <h2>${escapeHtml(data.title)}</h2>
          <p>${escapeHtml(data.description)}</p>
          <p><strong>Regeln</strong></p>
          <pre style="white-space:pre-wrap; font-family: var(--font-body); margin:0;">${escapeHtml(data.rules)}</pre>
          <p class="meta">Abgabe bis: ${deadline}</p>
        </article>
      `;

      if (data.phase === "submission" && new Date(data.deadline) > new Date()) {
        document.getElementById("submit-section").style.display = "block";
      }
    }

    document.getElementById("submit-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("submit-status");
      status.textContent = "Wird gesendet …";
      status.className = "form-status";

      if (!activeChallenge) {
        status.textContent = "Keine aktive Challenge gefunden.";
        status.className = "form-status error";
        return;
      }

      const file = document.getElementById("media").files[0];
      if (!file) {
        status.textContent = "Bitte eine Datei auswählen.";
        status.className = "form-status error";
        return;
      }
      if (file.size > 20 * 1024 * 1024) {
        status.textContent = "Datei ist größer als 20 MB.";
        status.className = "form-status error";
        return;
      }

      const mediaType = file.type.startsWith("video") ? "video" : "image";
      const filePath = `${activeChallenge.slug}/${crypto.randomUUID()}-${file.name}`;

      const { error: uploadError } = await supabase.storage
        .from("submissions")
        .upload(filePath, file);

      if (uploadError) {
        status.textContent = "Upload fehlgeschlagen: " + uploadError.message;
        status.className = "form-status error";
        return;
      }

      const { error: insertError } = await supabase.from("submissions").insert({
        challenge_id: activeChallenge.id,
        display_name: document.getElementById("display_name").value.trim(),
        is_team: document.getElementById("is_team").checked,
        description: document.getElementById("description").value.trim(),
        media_path: filePath,
        media_type: mediaType,
      });

      if (insertError) {
        status.textContent = "Fehler beim Speichern: " + insertError.message;
        status.className = "form-status error";
        return;
      }

      status.textContent = "Danke! Deine Abgabe wird geprüft und erscheint nach Freigabe in der Galerie.";
      status.className = "form-status ok";
      document.getElementById("submit-form").reset();
    });

    loadChallenge();
    trackPageView("challenge");
  </script>
</body>
</html>
